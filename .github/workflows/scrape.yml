name: Scrape job offers

on:
  schedule:
    # 10:00 UTC ≈ 5-6h du matin, Haïti (UTC-5 / UTC-4 selon l'heure d'été)
    - cron: "0 10 * * *"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npm run scrape
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
