name: Scrape job offers

on:
  schedule:
    # 10:00 UTC ≈ 5-6h du matin, Haïti (UTC-5 / UTC-4 selon l'heure d'été)
    - cron: "0 10 * * *"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger scrape on the deployed app
        run: |
          curl -sf -X POST https://job-tracker-mr41.onrender.com/api/scrape \
            -H "x-scrape-secret: ${{ secrets.SCRAPE_SECRET }}"
